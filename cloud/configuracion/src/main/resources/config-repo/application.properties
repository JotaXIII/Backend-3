eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
app.security.issuer=${OAUTH_ISSUER:http://localhost:9000}
app.security.jwk-uri=${OAUTH_JWK_URI:http://localhost:9000/oauth2/jwks}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_xyz}
spring.datasource.username=${DB_USER:banco}
spring.datasource.password=${DB_PASSWORD:banco123}
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health
spring.task.scheduling.pool.size=3
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
