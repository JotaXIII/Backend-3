spring.application.name=bff-cajeros
server.port=${PORT:8092}
spring.config.import=configserver:${CONFIG_URL:http://localhost:8888}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.prefer-ip-address=${PREFER_IP:true}
management.endpoint.health.show-details=never
server.error.include-message=always
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
