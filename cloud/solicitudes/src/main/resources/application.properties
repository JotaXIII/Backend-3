spring.application.name=solicitudes
server.port=${PORT:8080}
spring.config.import=configserver:${CONFIG_URL:http://localhost:8888}
spring.artemis.mode=native
spring.artemis.broker-url=${JMS_URL:tcp://localhost:61616}
spring.artemis.user=${JMS_USER:app}
spring.artemis.password=${JMS_PASSWORD:mensajeria-local}
spring.jms.template.delivery-mode=persistent
app.consultas.url=${CONSULTAS_URL:}
resilience4j.circuitbreaker.instances.consultas.sliding-window-size=4
resilience4j.circuitbreaker.instances.consultas.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.consultas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.consultas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.consultas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.consultas.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.consultas.max-attempts=2
resilience4j.retry.instances.consultas.wait-duration=200ms
resilience4j.retry.instances.consultas.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
