spring.application.name=pagos
server.port=${PORT:8085}
spring.config.import=configserver:${CONFIG_URL:http://localhost:8888}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.prefer-ip-address=${PREFER_IP:true}
management.endpoint.health.show-details=never
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_xyz}
spring.datasource.hikari.schema=pagos
spring.sql.init.schema-locations=classpath:schema.sql
app.oauth.token-url=${TOKEN_URL:http://localhost:9000/oauth2/token}
app.oauth.internal-secret=${OAUTH_INTERNAL_SECRET:interno-local}
app.kafka.bootstrap=${KAFKA_BOOTSTRAP:localhost:9092}
app.kafka.enabled=${KAFKA_ENABLED:true}
